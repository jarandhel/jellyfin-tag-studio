<!DOCTYPE html>
<html>
<head><title>Tag Studio</title></head>
<body>
<div id="TagStudioConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content">
    <div class="content-primary">
      <form id="TagStudioConfigForm">
        <div class="checkboxContainer checkboxContainer-withDescription">
          <label class="emby-checkbox-label">
            <input is="emby-checkbox" type="checkbox" id="AutoLockEditedFields" />
            <span>Lock edited fields</span>
          </label>
          <div class="fieldDescription checkboxFieldDescription">
            Adds the edited field to the item's locked fields so a "Replace all metadata"
            refresh cannot revert your edits. Strongly recommended.
          </div>
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="text" id="MachineTagPrefixes" label="Machine tag prefixes" />
          <div class="fieldDescription">
            Semicolon-separated. Tags with these prefixes are generated by other plugins
            (e.g. Language Tags) and are grouped separately and excluded from bulk delete.
          </div>
        </div>
        <div class="inputContainer">
          <input is="emby-input" type="number" id="SnapshotRetention" label="Undo history size" min="0" />
        </div>
        <button is="emby-button" type="submit" class="raised button-submit block">
          <span>Save</span>
        </button>
      </form>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var pluginId = '71b5006b-7144-4ef0-bee6-ae9f07d740b4';
      document.querySelector('#TagStudioConfigPage').addEventListener('pageshow', function () {
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (config) {
          document.querySelector('#AutoLockEditedFields').checked = config.AutoLockEditedFields;
          document.querySelector('#MachineTagPrefixes').value = config.MachineTagPrefixes || '';
          document.querySelector('#SnapshotRetention').value = config.SnapshotRetention;
          Dashboard.hideLoadingMsg();
        });
      });
      document.querySelector('#TagStudioConfigForm').addEventListener('submit', function (e) {
        e.preventDefault();
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (config) {
          config.AutoLockEditedFields = document.querySelector('#AutoLockEditedFields').checked;
          config.MachineTagPrefixes = document.querySelector('#MachineTagPrefixes').value;
          config.SnapshotRetention = parseInt(document.querySelector('#SnapshotRetention').value, 10);
          ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
            Dashboard.processPluginConfigurationUpdateResult(result);
          });
        });
        return false;
      });
    })();
  </script>
</div>
</body>
</html>
